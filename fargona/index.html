<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/fargona/assets/js/react.js"></script>
<script src="/fargona/assets/js/react-dom.js"></script>
<script src="/fargona/assets/js/dc-runtime.js"></script>
</head>
<body>


<x-dc>
<helmet>
<style>
  @font-face { font-family: 'Plus Jakarta Sans'; src: url("/fargona/assets/fonts/PlusJakartaSans.ttf") format('truetype-variations'); font-weight: 200 900; font-style: normal; font-display: swap; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060912; }
  body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }
  a { color: #FFFFFF; text-decoration: none; }
  a:hover { color: #FFFFFF; }
  @keyframes robbitCallGlow { 0%,100% { box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.35), 0 16px 40px rgba(81,81,255,0.5), 0 0 0 0 rgba(81,81,255,0.5); } 50% { box-shadow: inset 0 1.5px 1px rgba(255,255,255,0.35), 0 16px 40px rgba(81,81,255,0.5), 0 0 0 18px rgba(81,81,255,0); } }
  @keyframes robbitSlowZoom { 0%,100% { transform: scale(1.04); } 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  @media (max-width: 560px) {
    #robbit-cta { width: 100%; flex-wrap: wrap; justify-content: center; row-gap: 2px; padding-right: 16px; }
    #robbit-cta .cta-div { display: none; }
    #robbit-cta .cta-num { flex-basis: 100%; text-align: center; font-size: 15px; opacity: 0.92; }
  }
</style>
</helmet>

<div style="position:relative;width:100%;height:100dvh;min-height:100dvh;overflow:hidden;background:#060912;color:#FFFFFF">

  <img src="/fargona/assets/img/pic.webp" alt="Robbit darsi" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 42%;animation:robbitSlowZoom 30s ease-in-out infinite">

  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,18,0.62) 0%,rgba(6,9,18,0.18) 30%,rgba(6,9,18,0.55) 62%,rgba(6,9,18,0.92) 100%)"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(96deg,rgba(6,9,18,0.7) 0%,rgba(6,9,18,0.28) 42%,rgba(6,9,18,0) 72%)"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 18% 88%,rgba(81,81,255,0.28) 0%,rgba(81,81,255,0) 55%)"></div>
  <div style="position:absolute;inset:0;background:#060912;opacity:{{ overlayOpacity }};mix-blend-mode:multiply;pointer-events:none"></div>

  <div style="position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,3.2vw,40px) clamp(22px,4vw,64px) clamp(28px,4.4vw,60px)">

    <img src="/fargona/assets/img/logo.svg" alt="Robbit" style="width:clamp(104px,10vw,150px);height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,0.55))">

    <div style="display:flex;flex-direction:column;align-items:{{ alignItems }};text-align:{{ textAlign }};gap:clamp(20px,2.6vw,30px);max-width:900px">

      <h1 style="margin:0;font-size:clamp(34px,5.4vw,68px);line-height:1.04;letter-spacing:-0.035em;font-weight:800;text-wrap:pretty;text-shadow:0 4px 30px rgba(0,0,0,0.55)">Farg'ona shahridagi eng katta o'quv markaz</h1>

      <a href="tel:+998787773777" id="robbit-cta" style="display:inline-flex;align-items:center;gap:clamp(8px,1.4vw,18px);align-self:{{ alignSelf }};padding:clamp(9px,1.2vw,16px) clamp(16px,2vw,30px) clamp(9px,1.2vw,16px) clamp(9px,1.1vw,15px);border-radius:999px;background:linear-gradient(135deg,#7A7AFF 0%,#5151FF 52%,#3A2FD1 100%);border:1px solid rgba(255,255,255,0.22);color:#FFFFFF;animation:{{ ctaAnimation }};box-shadow:inset 0 1.5px 1px rgba(255,255,255,0.35),0 16px 40px rgba(81,81,255,0.5);transition:transform .18s cubic-bezier(.2,.9,.25,1)" style-hover="transform:translateY(-2px)" style-active="transform:scale(0.98)">
        <span style="width:clamp(38px,3.4vw,46px);height:clamp(38px,3.4vw,46px);flex:none;border-radius:50%;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.28);display:flex;align-items:center;justify-content:center">
          <svg sc-camel-view-box="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:52%;height:52%;display:block"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </span>
        <span style="font-size:clamp(15px,1.5vw,21px);font-weight:800;letter-spacing:-0.01em;white-space:nowrap">Hoziroq qo'ng'iroq qiling</span>
        <span class="cta-div" style="width:1px;height:clamp(20px,1.8vw,26px);background:rgba(255,255,255,0.35);flex:none"></span>
        <span class="cta-num" style="font-size:clamp(15px,1.5vw,21px);font-weight:800;letter-spacing:0.01em;white-space:nowrap">+998 78 777 37 77</span>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;overlayOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.14,&quot;min&quot;:0,&quot;max&quot;:0.6,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Fon&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;center&quot;],&quot;default&quot;:&quot;left&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Joylashuv&quot;},&quot;pulseCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Tugma&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const align = this.props.align ?? 'left';
    const centered = align === 'center';
    return {
      overlayOpacity: this.props.overlayOpacity ?? 0.14,
      alignItems: centered ? 'center' : 'flex-start',
      textAlign: centered ? 'center' : 'left',
      alignSelf: centered ? 'center' : 'flex-start',
      ctaAnimation: (this.props.pulseCta ?? true) ? 'robbitCallGlow 2.6s ease-in-out infinite' : 'none'
    };
  }
}
</script>


</body></html>
